name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - run: node --check static/app.js
      - run: node --check static/calculators.js
      - run: node --check static/downloads.js
      - run: node --check static/penetration.js
      - run: node --check static/penetration-breakdown.js
      - run: node --check static/libraries.js
      - run: node --check static/library-editor.js
      - run: node --check scripts/ocr_trafalgar_documents.cjs
      - run: node tests/test_ui.cjs
      - run: node tests/test_calculators_ui.cjs
      - run: node tests/test_project_ui.cjs
      - run: node tests/test_downloads_ui.cjs
      - run: node tests/test_penetration_ui.cjs
      - run: node tests/test_libraries_ui.cjs
      - run: node tests/test_library_editor_ui.cjs
      - run: python scripts/build.py
